<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edigne Parisis — Peintures</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a96e;
      --gold-light: #e2cc9a;
      --dark: #1a1a1a;
      --mid: #3a3a3a;
      --light: #f7f4ef;
      --cream: #fdf9f4;
      --text: #333;
      --muted: #888;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--dark);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      margin-left: 2rem;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active { color: var(--gold); }

    .hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #1a1a1a 60%, #0d0d0d 100%);
      color: #fff;
      text-align: center;
      padding: 5rem 2rem 4rem;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: 0.15em;
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1rem;
      color: #aaa;
      letter-spacing: 0.06em;
    }

    .filter-bar {
      background: var(--light);
      border-bottom: 1px solid #e0d8cc;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    .filter-bar button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 1rem 2rem;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-bar button:hover { color: var(--dark); }
    .filter-bar button.active {
      color: var(--dark);
      border-bottom-color: var(--gold);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* Masonry-style grid for paintings (varying heights) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .card-img {
      width: 100%;
      display: block;
      background: #f0ece5;
      object-fit: cover;
      aspect-ratio: 4/5;
    }

    .card-body {
      padding: 1rem 1.2rem 1.4rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 400;
      color: var(--dark);
      margin-bottom: 0.3rem;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      font-family: 'Helvetica Neue', sans-serif;
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }

    .card-meta {
      font-size: 0.75rem;
      color: #bbb;
      font-family: 'Helvetica Neue', sans-serif;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      background: #fff;
      max-width: 900px;
      width: 100%;
      border-radius: 2px;
      display: flex;
      overflow: hidden;
      max-height: 90vh;
    }

    .lightbox-img {
      width: 55%;
      object-fit: contain;
      background: #1a1a1a;
      max-height: 90vh;
    }

    .lightbox-info {
      padding: 2.5rem 2rem;
      flex: 1;
      overflow-y: auto;
    }

    .lightbox-title {
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--dark);
      margin-bottom: 1rem;
    }

    .lightbox-table {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.85rem;
      width: 100%;
      border-collapse: collapse;
    }

    .lightbox-table td {
      padding: 0.4rem 0;
      vertical-align: top;
      border-bottom: 1px solid #f0ece5;
    }

    .lightbox-table td:first-child {
      color: var(--muted);
      width: 40%;
      padding-right: 1rem;
    }

    .lightbox-desc {
      font-size: 0.9rem;
      color: #555;
      margin-top: 1.2rem;
      line-height: 1.7;
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .anfrage-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.65rem 1.8rem;
      background: var(--dark);
      color: var(--gold);
      text-decoration: none;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .anfrage-link:hover { background: var(--mid); }

    footer {
      background: var(--dark);
      color: #666;
      text-align: center;
      padding: 2.5rem 1rem;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }

    footer a { color: var(--gold); text-decoration: none; }

    @media (max-width: 600px) {
      .lightbox-inner { flex-direction: column; }
      .lightbox-img { width: 100%; max-height: 50vh; }
      header { padding: 0 1rem; }
      nav a { margin-left: 1rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><img src="uploads/oriabel_logo.png" alt="Oriabel — Nice, France"></a>
  <nav>
    <a href="index.html">Bijoux</a>
    <a href="gemaelde.html" class="active">Peintures</a>
  </nav>
</header>

<div class="hero">
  <h1>Edigne Parisis</h1>
  <p>Peintures — huile sur toile, acrylique, techniques mixtes</p>
</div>

<div class="filter-bar">
  <button class="active" data-cat="all">Tout</button>
  <button data-cat="figurativ">Figuratif</button>
  <button data-cat="landschaft">Paysage &amp; Ville</button>
  <button data-cat="abstrakt">Abstrait</button>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">&times;</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lbImg" src="" alt="">
    <div class="lightbox-info">
      <div class="lightbox-title" id="lbTitle"></div>
      <table class="lightbox-table" id="lbTable"></table>
      <div class="lightbox-desc" id="lbDesc"></div>
      <a class="anfrage-link" href="mailto:oriabel@oriabel.com">Demande de renseignements</a>
    </div>
  </div>
</div>

<footer>
  <p>&copy; Edigne Parisis &mdash; <a href="index.html">Oriabel, Nice</a> &mdash; <a href="mailto:oriabel@oriabel.com">Contact</a></p>
</footer>

<script>
const GEMAELDE_DATEN = [
  { id:"tableau-003", titel:"Tableau 003", kategorie:"figurativ", beschreibung:"Huile sur toile. Une composition intense, pleine d'énergie et de profondeur.", bild:"uploads/2019/02/Tableau-003.jpg", technik:"Huile sur toile", format:"60 × 80 cm", jahr:"2019", verfuegbarkeit:"Sur demande" },
  { id:"tableau-005", titel:"Tableau 005", kategorie:"figurativ", beschreibung:"Dialogue entre lumière et ombre — format portrait expressif.", bild:"uploads/2019/02/Tableau-005.jpg", technik:"Huile sur toile", format:"50 × 70 cm", jahr:"2019", verfuegbarkeit:"Sur demande" },
  { id:"tableau-007", titel:"Tableau 007", kategorie:"figurativ", beschreibung:"Grand format avec une palette puissante et une touche souveraine.", bild:"uploads/2019/02/Tableau-007.jpg", technik:"Huile sur toile", format:"80 × 100 cm", jahr:"2019", verfuegbarkeit:"Sur demande" },
  { id:"11-novembre", titel:"11 Novembre – Ville Donner", kategorie:"landschaft", beschreibung:"Style naïf, scène populaire finement travaillée. 11 novembre – une fête du souvenir.", bild:"uploads/2019/02/DSC02328.jpg", technik:"Huile sur toile", format:"70 × 90 cm", jahr:"2018", verfuegbarkeit:"Sur demande" },
  { id:"rue-de-ville", titel:"Rue de Ville", kategorie:"landschaft", beschreibung:"Scène urbaine impressionniste avec clocher, signée E. Parisis.", bild:"uploads/2019/02/IMG_7011.jpg", technik:"Huile sur toile", format:"60 × 80 cm", jahr:"vers 1950", verfuegbarkeit:"Sur demande" },
  { id:"plage-de-nice", titel:"Plage de Nice", kategorie:"landschaft", beschreibung:"La Baie des Anges sous la lumière de midi. Format panoramique, atmosphère méditerranéenne.", bild:"uploads/2019/02/plage-de-Nice.jpg", technik:"Huile sur toile", format:"90 × 70 cm", jahr:"2017", verfuegbarkeit:"Sur demande" },
  { id:"tableau-021", titel:"Tableau 021", kategorie:"abstrakt", beschreibung:"Composition libre — la touche comme expression du mouvement et de la dynamique.", bild:"uploads/2019/02/Tableau-021.jpg", technik:"Huile sur toile", format:"70 × 100 cm", jahr:"2018", verfuegbarkeit:"Sur demande" },
  { id:"tableau-022", titel:"Tableau 022", kategorie:"abstrakt", beschreibung:"Haute atmosphère avec une palette expressive.", bild:"uploads/2019/02/Tableau-022.jpg", technik:"Technique mixte", format:"50 × 80 cm", jahr:"2018", verfuegbarkeit:"Sur demande" },
  { id:"tableau-025", titel:"Tableau 025", kategorie:"abstrakt", beschreibung:"Composition puissante — la lumière comme thème pictural central.", bild:"uploads/2019/02/Tableau-025.jpg", technik:"Huile sur bois", format:"40 × 60 cm", jahr:"2018", verfuegbarkeit:"Sur demande" },
  { id:"tableau-026", titel:"Tableau 026", kategorie:"abstrakt", beschreibung:"Transitions fluides entre couleur et forme — acrylique sur toile.", bild:"uploads/2019/02/Tableau-026.jpg", technik:"Acrylique sur toile", format:"80 × 80 cm", jahr:"2018", verfuegbarkeit:"Sur demande" }
];

const catLabels = { figurativ:"Figuratif", landschaft:"Paysage & Ville", abstrakt:"Abstrait" };
let activeCat = "all";

function renderGrid() {
  const grid = document.getElementById("grid");
  const items = activeCat === "all" ? GEMAELDE_DATEN : GEMAELDE_DATEN.filter(d => d.kategorie === activeCat);
  grid.innerHTML = items.map(d => `
    <div class="card" onclick="openLightbox('${d.id}')">
      <img class="card-img" src="${d.bild}" alt="${d.titel}" loading="lazy" onerror="this.style.background='#e8e2d8'">
      <div class="card-body">
        <div class="card-title">${d.titel}</div>
        <div class="card-desc">${d.beschreibung}</div>
        <div class="card-meta">${catLabels[d.kategorie] || ''} &mdash; ${d.format}</div>
      </div>
    </div>
  `).join("");
}

function openLightbox(id) {
  const d = GEMAELDE_DATEN.find(x => x.id === id);
  if (!d) return;
  document.getElementById("lbImg").src = d.bild;
  document.getElementById("lbImg").alt = d.titel;
  document.getElementById("lbTitle").textContent = d.titel;
  const rows = [
    ["Technique", d.technik],
    ["Format", d.format],
    ["Année", d.jahr],
    ["Disponibilité", d.verfuegbarkeit]
  ];
  document.getElementById("lbTable").innerHTML = rows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  document.getElementById("lbDesc").textContent = d.beschreibung;
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("lbClose").onclick = closeLightbox;
document.getElementById("lightbox").onclick = function(e) { if (e.target === this) closeLightbox(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

document.querySelectorAll(".filter-bar button").forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll(".filter-bar button").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    activeCat = this.dataset.cat;
    renderGrid();
  };
});

renderGrid();
</script>
</body>
</html>
