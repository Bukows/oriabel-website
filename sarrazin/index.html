<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #c0392b;
      --red-bg: #fdf0ef;
      --blue:   #2E75B6;
      --dark:   #1a1a1a;
      --mid:    #555;
      --muted:  #888;
      --light:  #f5f7fa;
      --card:   #ffffff;
      --border: #e0e4e8;
      --gold:   #c8a96e;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--light);
      color: var(--dark);
      font-size: 15px;
      line-height: 1.55;
    }

    /* ── HEADER ── */
    header {
      background: var(--dark);
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .header-title {
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .header-sub {
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .lang-switcher {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .lang-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
      padding: 0.3rem 0.55rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }

    .lang-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .lang-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1a1a;
    }

    /* ── ADDRESS BAR ── */
    .address-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.2rem;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .address-bar strong { color: var(--dark); }

    /* ── MAIN ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* ── EMERGENCY ── */
    .emergency-tile {
      background: var(--red);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .emergency-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.1rem;
    }

    .emergency-header h2 {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .emerg-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .emergency-body {
      background: var(--red-bg);
      padding: 0.8rem 1.1rem 1rem;
    }

    .emerg-row {
      display: flex;
      gap: 0.8rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(192,57,43,0.12);
      align-items: flex-start;
    }

    .emerg-row:last-child { border-bottom: none; }

    .emerg-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--red);
      min-width: 130px;
      flex-shrink: 0;
      line-height: 1.4;
    }

    .emerg-value {
      font-size: 0.85rem;
      color: var(--dark);
      line-height: 1.5;
    }

    .emerg-value a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .emerg-number {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--red);
      letter-spacing: 0.02em;
    }

    .emerg-numbers {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      padding: 0.5rem 0 0.7rem;
    }

    .emerg-num-item {
      text-align: center;
    }

    .emerg-num-item .num { font-size: 2rem; font-weight: 900; color: var(--red); line-height: 1; }
    .emerg-num-item .lbl { font-size: 0.7rem; color: #666; margin-top: 0.1rem; }

    /* ── GRID ── */
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 1.2rem 0 0.5rem 0.2rem;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .tile-grid.single { grid-template-columns: 1fr; }

    /* ── CARD / TILE ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-toggle {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card-toggle:hover { background: #fafafa; }

    .card-icon {
      font-size: 1.15rem;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .card-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dark);
      flex: 1;
    }

    .card-chevron {
      color: var(--muted);
      font-size: 0.7rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .card.open .card-chevron { transform: rotate(180deg); }

    .card-body {
      display: none;
      border-top: 1px solid var(--border);
    }

    .card.open .card-body { display: block; }

    /* ── INFO TABLE ── */
    .info-table {
      width: 100%;
    }

    .info-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child { border-bottom: none; }

    .info-key {
      background: #f0f4f8;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--mid);
      padding: 0.55rem 0.8rem;
      min-width: 38%;
      max-width: 38%;
      flex-shrink: 0;
      line-height: 1.4;
    }

    .info-val {
      font-size: 0.82rem;
      color: var(--dark);
      padding: 0.55rem 0.85rem;
      line-height: 1.5;
      flex: 1;
    }

    .info-val a {
      color: var(--blue);
      text-decoration: none;
    }

    .info-val.full {
      min-width: 100%;
      background: #fafbfc;
    }

    .warn { color: #b85c00; font-weight: 600; }

    /* ── WIFI BLOCK ── */
    .wifi-block {
      padding: 1rem 1.1rem;
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .wifi-info { flex: 1; min-width: 180px; }

    .wifi-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 0.84rem;
    }

    .wifi-key { color: var(--muted); min-width: 80px; }
    .wifi-val { font-weight: 600; color: var(--dark); word-break: break-all; }

    .wifi-qr { flex-shrink: 0; }
    .wifi-qr canvas, .wifi-qr img { width: 90px; height: 90px; }

    /* ── MAP ── */
    #map {
      height: 340px;
      border-radius: 0 0 var(--radius) var(--radius);
    }

    @media (max-width: 500px) { #map { height: 260px; } }

    .map-header {
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* ── MOBILE ── */
    @media (max-width: 520px) {
      .tile-grid { grid-template-columns: 1fr; }
      .emerg-label { min-width: 110px; font-size: 0.76rem; }
      header { padding: 0.8rem 0.9rem; }
      main { padding: 0.75rem; }
      .emerg-num-item .num { font-size: 1.6rem; }
    }

    @media (min-width: 600px) {
      .tile-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

// ─── MAP SETUP ──────────────────────────────────────────────────────────────

let map = null;

function initMap(lang) {
  const restos = T[lang].restos;

  if (!map) {
    map = L.map('map').setView([43.7, 7.265], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    // Apartment marker
    const aptIcon = L.divIcon({
      html: '<div style="background:#2E75B6;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)">🏠</div>',
      className: '', iconSize:[32,32], iconAnchor:[16,16]
    });
    L.marker([43.7102, 7.2175], {icon: aptIcon})
      .addTo(map)
      .bindPopup('<strong>Tour Sarrazin</strong><br>93 Bd Édouard Herriot');
  } else {
    map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
    // Re-add apartment
    const aptIcon = L.divIcon({
      html: '<div style="background:#2E75B6;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)">🏠</div>',
      className: '', iconSize:[32,32], iconAnchor:[16,16]
    });
    L.marker([43.7102, 7.2175], {icon: aptIcon})
      .addTo(map)
      .bindPopup('<strong>Tour Sarrazin</strong><br>93 Bd Édouard Herriot');
  }

  restos.forEach((r, i) => {
    const icon = L.divIcon({
      html: `<div style="background:#c0392b;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3)">${i+1}</div>`,
      className: '', iconSize:[28,28], iconAnchor:[14,14]
    });
    L.marker([r.lat, r.lng], {icon})
      .addTo(map)
      .bindPopup(`<strong>${i+1}. ${r.name}</strong><br>${r.addr}`);
  });

  setTimeout(() => map.invalidateSize(), 100);
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function rowsToHtml(rows) {
  return rows.map(r => {
    if (r[0] === null) {
      return `<div class="info-row"><div class="info-val full" style="min-width:100%;padding:0.6rem 0.85rem">${escHtml(r[1]).replace(/\n/g,'<br>')}</div></div>`;
    }
    const warn = r[0].includes('⚠') ? ' class="warn"' : '';
    return `<div class="info-row">
      <div class="info-key"${warn}>${escHtml(r[0]).replace(/⚠/g,'⚠')}</div>
      <div class="info-val">${escHtml(r[1]).replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('');
}

function buildCard(item, open) {
  const openClass = open ? ' open' : '';
  if (item.wifi) {
    return `<div class="card${openClass}">
      <div class="card-toggle" onclick="toggleCard(this)">
        <div class="card-icon">${item.icon}</div>
        <div class="card-label">${escHtml(item.label)}</div>
        <div class="card-chevron">▼</div>
      </div>
      <div class="card-body">
        <div class="wifi-block">
          <div class="wifi-info">
            ${item.rows.map(r => `<div class="wifi-row"><span class="wifi-key">${escHtml(r[0])}</span><span class="wifi-val">${escHtml(r[1])}</span></div>`).join('')}
          </div>
          <div class="wifi-qr" id="wifi-qr-${item.label.replace(/\s/g,'')}"></div>
        </div>
      </div>
    </div>`;
  }
  return `<div class="card${openClass}">
    <div class="card-toggle" onclick="toggleCard(this)">
      <div class="card-icon">${item.icon}</div>
      <div class="card-label">${escHtml(item.label)}</div>
      <div class="card-chevron">▼</div>
    </div>
    <div class="card-body">
      <div class="info-table">${rowsToHtml(item.rows)}</div>
    </div>
  </div>`;
}

function renderWifiQR() {
  const qrTargets = document.querySelectorAll('[id^="wifi-qr-"]');
  qrTargets.forEach(el => {
    if (el.children.length === 0) {
      const canvas = document.createElement('canvas');
      el.appendChild(canvas);
      // Simple QR using a lightweight approach — generate data URI
      const ssid = 'Freebox-C7C7DD';
      const pw = '4drmkq9dt2qw95r6qfkr95';
      // Use a free QR API as fallback
      const img = document.createElement('img');
      img.src = `https://api.qrserver.com/v1/create-qr-code/?data=WIFI:T:WPA;S:${encodeURIComponent(ssid)};P:${encodeURIComponent(pw)};;&size=90x90&margin=2`;
      img.alt = 'QR Code Wi-Fi';
      img.style.borderRadius = '6px';
      el.replaceChildren(img);
    }
  });
}

let currentLang = 'de';
let restoMapRendered = false;

function setLang(lang) {
  currentLang = lang;
  const t = T[lang];
  document.documentElement.lang = lang;

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));

  // Header
  document.getElementById('floor-info').textContent = '· ' + t.floorInfo;
  document.getElementById('s-emerg').textContent = t.sEmerg;
  document.getElementById('lbl-police').textContent = t.police;
  document.getElementById('lbl-fire').textContent = t.fire;
  document.getElementById('lbl-eu').textContent = t.eu;
  document.getElementById('sec-apt').textContent = t.sApt;
  document.getElementById('sec-ext').textContent = t.sExt;
  document.getElementById('sec-resto').textContent = t.sResto;
  document.getElementById('map-label').textContent = t.mapLabel;
  document.getElementById('footer-text').textContent = t.footer;

  // Emergency rows
  const er = document.getElementById('emerg-rows');
  er.innerHTML = t.emergRows.map(([lbl, val]) => {
    const warn = lbl.includes('⚠') || lbl.toLowerCase().includes('wasser') || lbl.toLowerCase().includes('strom') || lbl.toLowerCase().includes('water') || lbl.toLowerCase().includes('electr') || lbl.toLowerCase().includes('eau') || lbl.toLowerCase().includes('électr') || lbl.toLowerCase().includes('couper') ? ' class="warn"' : '';
    return `<div class="emerg-row">
      <div class="emerg-label"${warn}>${escHtml(lbl)}</div>
      <div class="emerg-value">${escHtml(val).replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('');

  // Apt grid
  const gApt = document.getElementById('grid-apt');
  gApt.innerHTML = t.apt.map((item, i) => buildCard(item, i < 2)).join('');

  // Ext grid
  const gExt = document.getElementById('grid-ext');
  gExt.innerHTML = t.ext.map((item, i) => buildCard(item, i === 0)).join('');

  // Restaurant list
  const rl = document.getElementById('resto-list');
  rl.innerHTML = t.restos.map((r, i) =>
    `<div style="display:flex;gap:0.6rem;padding:0.3rem 0;border-bottom:1px solid var(--border);font-size:0.83rem;align-items:flex-start">
      <span style="background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px">${i+1}</span>
      <div><strong>${escHtml(r.name)}</strong><br><span style="color:var(--muted)">${escHtml(r.addr)}</span></div>
    </div>`
  ).join('');

  renderWifiQR();
  initMap(lang);
}

function toggleCard(toggleEl) {
  const card = toggleEl.closest('.card');
  card.classList.toggle('open');
  if (card.classList.contains('open') && map) {
    setTimeout(() => map.invalidateSize(), 50);
  }
}
