<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Sarrazine — Gästeinfo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #c0392b;
      --red-bg: #fdf0ef;
      --blue:   #2E75B6;
      --dark:   #1a1a1a;
      --sage:   #7d9182;
      --sage-light: #a0b0a5;
      --mid:    #555;
      --muted:  #888;
      --light:  #f5f7fa;
      --card:   #ffffff;
      --border: #e0e4e8;
      --gold:   #c8a96e;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--light);
      color: var(--dark);
      font-size: 15px;
      line-height: 1.55;
    }

    /* ── HEADER ── */
    header {
      background: var(--light);
      padding: 0.6rem 1rem;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      background: var(--sage);
      padding: 0.75rem 1.2rem;
      border-radius: var(--radius);
    }

    .header-title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .header-title {
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-sub {
      color: rgba(255,255,255,0.65);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .lang-switcher {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
      justify-content: flex-end;
    }

    .lang-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.8);
      padding: 0.28rem 0.5rem;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .lang-btn .flag { font-size: 1.1rem; }
    .lang-btn .code { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; }

    .lang-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }
    .lang-btn.active {
      background: rgba(255,255,255,0.28);
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }

    /* ── ADDRESS BAR ── */
    .address-bar {
      background: #edf0ed;
      border-bottom: 1px solid #d5ddd6;
      padding: 0.5rem 1.2rem;
      font-size: 0.8rem;
      color: var(--sage-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
    }

    .address-bar strong { color: #4a6352; }

    /* ── MAIN ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* ── EMERGENCY ── */
    .emergency-tile {
      background: var(--red);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .emergency-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.1rem;
    }

    .emergency-header h2 {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .emerg-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .emergency-body {
      background: var(--red-bg);
      padding: 0.8rem 1.1rem 1rem;
    }

    .emerg-row {
      display: flex;
      gap: 0.8rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(192,57,43,0.12);
      align-items: flex-start;
    }

    .emerg-row:last-child { border-bottom: none; }

    .emerg-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--red);
      min-width: 130px;
      flex-shrink: 0;
      line-height: 1.4;
    }

    .emerg-value {
      font-size: 0.85rem;
      color: var(--dark);
      line-height: 1.5;
    }

    .emerg-value a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .emerg-number {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--red);
      letter-spacing: 0.02em;
    }

    /* ── KPI TILES ── */
    .emerg-numbers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      padding: 0.75rem;
    }

    @media (max-width: 380px) {
      .emerg-numbers { grid-template-columns: repeat(2, 1fr); }
    }

    a.emerg-kpi {
      background: #fff;
      border: 2px solid var(--red);
      border-radius: 8px;
      padding: 1rem 0.5rem 0.85rem;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    a.emerg-kpi:hover, a.emerg-kpi:active { background: var(--red); }
    a.emerg-kpi:hover .kpi-num, a.emerg-kpi:active .kpi-num { color: #fff; }
    a.emerg-kpi:hover .kpi-lbl, a.emerg-kpi:active .kpi-lbl { color: rgba(255,255,255,0.85); }

    .kpi-num {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .kpi-lbl {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 700;
    }

    /* ── GRID ── */
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 1.2rem 0 0.5rem 0.2rem;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .tile-grid.single { grid-template-columns: 1fr; }

    /* ── CARD / TILE ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-toggle {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card-toggle:hover { background: #fafafa; }

    .card-icon {
      font-size: 1.15rem;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }

    .card-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dark);
      flex: 1;
    }

    .card-chevron {
      color: var(--muted);
      font-size: 0.7rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .card.open .card-chevron { transform: rotate(180deg); }

    .card-body {
      display: none;
      border-top: 1px solid var(--border);
    }

    .card.open .card-body { display: block; }

    /* ── INFO TABLE ── */
    .info-table {
      width: 100%;
    }

    .info-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child { border-bottom: none; }

    .info-key {
      background: #f0f4f8;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--mid);
      padding: 0.55rem 0.8rem;
      min-width: 38%;
      max-width: 38%;
      flex-shrink: 0;
      line-height: 1.4;
    }

    .info-val {
      font-size: 0.82rem;
      color: var(--dark);
      padding: 0.55rem 0.85rem;
      line-height: 1.5;
      flex: 1;
    }

    .info-val a {
      color: var(--blue);
      text-decoration: none;
    }

    .info-val.full {
      min-width: 100%;
      background: #fafbfc;
    }

    .warn { color: #b85c00; font-weight: 600; }

    /* ── LINKS: TEL & MAPS ── */
    a.tel-link {
      color: inherit;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px dotted currentColor;
    }
    a.tel-link:hover { opacity: 0.75; }

    a.maps-link {
      color: #2563a8;
      text-decoration: none;
      border-bottom: 1px dotted #2563a8;
    }
    a.maps-link:hover { opacity: 0.75; }

    a.num-call {
      text-decoration: none;
      color: inherit;
    }
    a.num-call:hover .num { opacity: 0.75; }

    .emerg-value a.tel-link { color: var(--red); border-bottom-color: var(--red); }

    a.ext-link {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid var(--blue);
      font-weight: 600;
    }
    a.ext-link:hover { opacity: 0.75; }

    /* ── WIFI BLOCK ── */
    .wifi-block {
      padding: 1rem 1.1rem;
      display: flex;
      gap: 1.4rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .wifi-info { flex: 1; min-width: 200px; }

    .wifi-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
      font-size: 0.84rem;
    }

    .wifi-key { color: var(--muted); min-width: 90px; flex-shrink: 0; }
    .wifi-val { font-weight: 600; color: var(--dark); word-break: break-all; flex: 1; }

    .copy-btn {
      background: #f0f4f8;
      border: 1px solid var(--border);
      color: var(--mid);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #e0e8f0; }
    .copy-btn.copied { background: #d4edda; color: #2a6638; border-color: #b8dfc4; }

    .wifi-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
      line-height: 1.4;
    }

    .wifi-qr { flex-shrink: 0; text-align: center; }
    .wifi-qr img { width: 120px; height: 120px; border-radius: 6px; display: block; }
    .wifi-qr-label { font-size: 0.68rem; color: var(--muted); margin-top: 0.3rem; text-align: center; }

    /* ── MAP ── */
    #map {
      height: 340px;
      border-radius: 0 0 var(--radius) var(--radius);
    }

    @media (max-width: 500px) { #map { height: 260px; } }

    .map-header {
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* ── MOBILE ── */
    @media (max-width: 520px) {
      .tile-grid { grid-template-columns: 1fr; }
      .emerg-label { min-width: 110px; font-size: 0.76rem; }
      header { padding: 0.8rem 0.9rem; }
      main { padding: 0.75rem; }
      .kpi-num { font-size: 1.9rem; }
    }

    @media (min-width: 600px) {
      .tile-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

  <div class="header-inner">

    </div>
    <div class="lang-switcher">

<main>

  <!-- EXTERNAL -->
  <div class="section-title" id="sec-ext"></div>
  <div class="tile-grid" id="grid-ext"></div>

  <!-- RESTAURANTS MAP -->
  <div class="section-title" id="sec-resto"></div>
  <div class="tile-grid single">
    <div class="card open">
      <div class="card-toggle" onclick="toggleCard(this)">
        <div class="card-icon">🗺️</div>
        <div class="card-label" id="map-label">Restaurants (Empfehlungen)</div>
        <div class="card-chevron">▼</div>
      </div>
      <div class="card-body">
        <div id="resto-list" style="padding:0.6rem 1.1rem 0.5rem; border-bottom:1px solid var(--border)"></div>
        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- LEISURE -->
  <div class="tile-grid" id="grid-leisure"></div>

</main>

<footer id="footer-text"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

      html: `<div style="background:#c0392b;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3)">${i+1}</div>`,
      className: '', iconSize:[28,28], iconAnchor:[14,14]
    });
    L.marker([r.lat, r.lng], {icon})
      .addTo(map)
      .bindPopup(`<strong>${i+1}. ${r.name}</strong><br>${r.addr}`);
  });

  setTimeout(() => map.invalidateSize(), 100);
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderVal(val) {
  if (!val) return '';

  // Extract [text](url) markdown links before escaping
  const links = [];
  const withPlaceholders = val.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (m, text, url) => {
    links.push({ text, url });
    return `\x00LINK${links.length - 1}\x00`;
  });

  let s = escHtml(withPlaceholders).replace(/\n/g, '<br>');

  // Restore markdown links
  links.forEach((l, i) => {
    s = s.replace(`\x00LINK${i}\x00`, `<a href="${l.url}" class="ext-link" target="_blank">${escHtml(l.text)}</a>`);
  });

  // Phone numbers: +33 X XX XX XX XX  or  0X XX XX XX XX  or  04 XX XX XX XX
  s = s.replace(/(\+33[\s]?\d(?:[\s]?\d{2}){4}|\b0[1-9](?:[\s.]?\d{2}){4})/g, function(m) {
    const digits = m.replace(/[^\d]/g, '');
    const tel = digits.startsWith('0') ? '+33' + digits.slice(1) : '+' + digits;
    return `<a href="tel:${tel}" class="tel-link">${m}</a>`;
  });

  // Street addresses (French patterns)
  s = s.replace(/((?:\d+\s+)?(?:Rue|Av\.|Avenue|Bd\b|Boulevard|Promenade|Voie|Chemin|Place|Allée|Impasse)[^<]{4,80})/gi, function(m) {
    const clean = m.replace(/<br>/g, ' ').replace(/\s+/g, ' ').trim();
    return `<a href="https://maps.google.com/?q=${encodeURIComponent(clean)}" class="maps-link" target="_blank">${m}</a>`;
  });

  return s;
}

function rowsToHtml(rows) {
  return rows.map(r => {
    if (r[0] === null) {
      return `<div class="info-row"><div class="info-val full" style="min-width:100%;padding:0.6rem 0.85rem">${renderVal(r[1])}</div></div>`;
    }
    const warn = r[0].includes('⚠') ? ' class="warn"' : '';
    return `<div class="info-row">
      <div class="info-key"${warn}>${escHtml(r[0]).replace(/⚠/g,'⚠')}</div>
      <div class="info-val">${renderVal(r[1])}</div>
    </div>`;
  }).join('');
}

function buildCard(item, open) {
  const openClass = open ? ' open' : '';
  if (item.wifi) {
    const ssid = 'Freebox-C7C7DD';
    const pw = '4drmkq9dt2qw95r6qfkr95';
    const copyLbl = escHtml(item.rows[3][1]);
    const scanLbl = escHtml(item.rows[4][1]);
    return `<div class="card${openClass}">
      <div class="card-toggle" onclick="toggleCard(this)">
        <div class="card-icon">${item.icon}</div>
        <div class="card-label">${escHtml(item.label)}</div>
        <div class="card-chevron">▼</div>
      </div>
      <div class="card-body">
        <div class="wifi-block">
          <div class="wifi-info">
            <div class="wifi-row">
              <span class="wifi-key">${escHtml(item.rows[0][0])}</span>
              <span class="wifi-val">${escHtml(ssid)}</span>
              <button class="copy-btn" onclick="copyText('${ssid}', this)">${copyLbl}</button>
            </div>
            <div class="wifi-row">
              <span class="wifi-key">${escHtml(item.rows[1][0])}</span>
              <span class="wifi-val">${escHtml(pw)}</span>
              <button class="copy-btn" onclick="copyText('${pw}', this)">${copyLbl}</button>
            </div>
            <div class="wifi-hint">${escHtml(item.rows[2][1])}</div>
          </div>
          <div class="wifi-qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?data=WIFI:T:WPA;S:${encodeURIComponent(ssid)};P:${encodeURIComponent(pw)};;&size=120x120&margin=4" alt="QR Code Wi-Fi" loading="lazy">
            <div class="wifi-qr-label">${scanLbl}</div>
          </div>
        </div>
      </div>
    </div>`;
  }
  if (item.shopmap) {
    const lang = document.documentElement.lang || 'de';
    const shopList = SHOP_PINS.map((p, i) => `
      <div style="display:flex;gap:0.65rem;padding:0.4rem 0.85rem;border-bottom:1px solid var(--border);align-items:flex-start;font-size:0.84rem">
        <span style="background:var(--sage);color:#fff;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px">${i+1}</span>
        <div>
          <strong>${p.n}</strong>
          <span style="color:var(--muted);font-size:0.76rem;margin-left:0.3rem">${p.t[lang]||p.t.de}</span><br>
          <span style="color:#2563a8;font-size:0.78rem">${p.a}</span>
        </div>
      </div>`).join('');
    return `<div class="card${openClass}">
      <div class="card-toggle" onclick="toggleCard(this)">
        <div class="card-icon">${item.icon}</div>
        <div class="card-label">${escHtml(item.label)}</div>
        <div class="card-chevron">▼</div>
      </div>
      <div class="card-body">
        <div class="info-table">${rowsToHtml(item.rows)}</div>
        <div style="border-top:2px solid var(--border)">${shopList}</div>
        <div id="shop-map" style="height:260px;margin:0.5rem 0.75rem 0.75rem;border-radius:8px;overflow:hidden;"></div>
      </div>
    </div>`;
  }
  return `<div class="card${openClass}">
    <div class="card-toggle" onclick="toggleCard(this)">
      <div class="card-icon">${item.icon}</div>
      <div class="card-label">${escHtml(item.label)}</div>
      <div class="card-chevron">▼</div>
    </div>
    <div class="card-body">
      <div class="info-table">${rowsToHtml(item.rows)}</div>
    </div>
  </div>`;
}

function renderWifiQR() { /* handled inline in buildCard */ }

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = btn.textContent.includes('✓') ? (currentLang === 'fr' ? 'Copier' : currentLang === 'en' ? 'Copy' : 'Kopieren') : btn.textContent; btn.classList.remove('copied'); }, 1800);
  });
}

let currentLang = 'de';
let restoMapRendered = false;

function setLang(lang) {
  currentLang = lang;
  const t = T[lang];
  document.documentElement.lang = lang;

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => {
    const code = b.querySelector('.code');
    b.classList.toggle('active', code && code.textContent === lang.toUpperCase());
  });

  // Header
  document.getElementById('floor-info').textContent = '· ' + t.floorInfo;
  document.getElementById('s-emerg').textContent = t.sEmerg;
  document.getElementById('lbl-police').textContent = t.police;
  document.getElementById('lbl-fire').textContent = t.fire;
  document.getElementById('lbl-eu').textContent = t.eu;
  document.getElementById('addr-copy-btn').textContent = t.copyAddr;
  document.getElementById('sec-apt').textContent = t.sApt;
  document.getElementById('sec-ext').textContent = t.sExt;
  document.getElementById('sec-resto').textContent = t.sResto;
  document.getElementById('map-label').textContent = t.mapLabel;
  document.getElementById('footer-text').textContent = t.footer;

  // Emergency rows
  const er = document.getElementById('emerg-rows');
  er.innerHTML = t.emergRows.map(([lbl, val]) => {
    const warn = lbl.includes('⚠') || lbl.toLowerCase().includes('wasser') || lbl.toLowerCase().includes('strom') || lbl.toLowerCase().includes('water') || lbl.toLowerCase().includes('electr') || lbl.toLowerCase().includes('eau') || lbl.toLowerCase().includes('électr') || lbl.toLowerCase().includes('couper') ? ' class="warn"' : '';
    return `<div class="emerg-row">
      <div class="emerg-label"${warn}>${escHtml(lbl)}</div>
      <div class="emerg-value">${renderVal(val)}</div>
    </div>`;
  }).join('');

  // Apt grid
  const gApt = document.getElementById('grid-apt');
  gApt.innerHTML = t.apt.map((item, i) => buildCard(item, i < 2)).join('');

  // Ext grid
  const gExt = document.getElementById('grid-ext');
  gExt.innerHTML = t.ext.map((item, i) => buildCard(item, i === 0)).join('');

  // Restaurant list
  const rl = document.getElementById('resto-list');
  rl.innerHTML = t.restos.map((r, i) => {
    const mapsUrl = `https://maps.google.com/?q=${encodeURIComponent(r.addr + ', Nice, France')}`;
    return `<div style="display:flex;gap:0.6rem;padding:0.3rem 0;border-bottom:1px solid var(--border);font-size:0.83rem;align-items:flex-start">
      <span style="background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px">${i+1}</span>
      <div><strong>${escHtml(r.name)}</strong><br><a href="${mapsUrl}" class="maps-link" target="_blank">${escHtml(r.addr)}</a></div>
    </div>`;
  }).join('');

  renderWifiQR();
  initMap(lang);
}

function toggleCard(toggleEl) {
  const card = toggleEl.closest('.card');
  card.classList.toggle('open');
  if (card.classList.contains('open')) {
    if (map) setTimeout(() => map.invalidateSize(), 50);
    if (card.querySelector('#shop-map')) initShopMap(document.documentElement.lang);
  }
}

// Init
setLang('de');
</script>
